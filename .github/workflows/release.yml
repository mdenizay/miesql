name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches Info.plist
        run: |
          PLIST_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          if [ "$PLIST_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag is ${{ steps.version.outputs.tag }} but Info.plist says $PLIST_VERSION. Bump one of them."
            exit 1
          fi

      - name: Test
        run: swift test

      # The script builds each slice with plain SwiftPM and joins them with lipo, so this
      # step needs no Xcode-specific behaviour and matches what a contributor gets locally.
      - name: Build universal app
        run: ./Scripts/bundle-app.sh release --universal

      - name: Verify the bundle
        run: |
          lipo -archs build/MieSQL.app/Contents/MacOS/MieSQL
          lipo -archs build/MieSQL.app/Contents/MacOS/MieSQL | grep -q arm64
          lipo -archs build/MieSQL.app/Contents/MacOS/MieSQL | grep -q x86_64
          codesign --verify --verbose build/MieSQL.app

      # ditto, not zip: it preserves the bundle's symlinks and metadata, which a plain zip
      # mangles badly enough that the app will not launch after unpacking.
      - name: Package
        run: |
          ditto -c -k --keepParent build/MieSQL.app "MieSQL-${{ steps.version.outputs.tag }}-macos-universal.zip"
          shasum -a 256 "MieSQL-${{ steps.version.outputs.tag }}-macos-universal.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "MieSQL ${{ steps.version.outputs.tag }}" \
            --notes-file .github/RELEASE_NOTES.md \
            --verify-tag \
            "MieSQL-${{ steps.version.outputs.tag }}-macos-universal.zip" \
            SHA256SUMS.txt
