name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release, e.g. v0.2.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal macOS build rather than two, so there is a single download that
          # runs on Apple Silicon and Intel alike.
          - os: macos-15
            label: macOS (universal)
            args: --target universal-apple-darwin
          - os: ubuntu-22.04
            label: Linux (deb, rpm, AppImage)
            args: ""
          - os: windows-latest
            label: Windows (installer)
            args: ""

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-15' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Check the tag matches the app version
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          CONFIG_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$CONFIG_VERSION" != "${TAG#v}" ]; then
            echo "::error::Tag is $TAG but tauri.conf.json says $CONFIG_VERSION. Bump one of them."
            exit 1
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts. Without these the update check would find a
          # release it refuses to install, which is worse than not publishing one.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: MieSQL ${{ github.event.inputs.tag || github.ref_name }}
          releaseBody: ${{ github.workspace }}/.github/RELEASE_NOTES.md
          releaseDraft: false
          prerelease: false
          # tauri-action writes latest.json from the signed artifacts of every matrix job,
          # which is exactly what the updater endpoint reads.
          includeUpdaterJson: true
          args: ${{ matrix.args }}
