name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release, e.g. v0.2.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal macOS build rather than two, so there is a single download that
          # runs on Apple Silicon and Intel alike.
          - os: macos-15
            label: macOS (universal)
            args: --target universal-apple-darwin
          - os: ubuntu-22.04
            label: Linux (deb, rpm, AppImage)
            args: ""
          - os: windows-latest
            label: Windows (installer)
            args: ""

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-15' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Check the tag matches the app version
        shell: bash
        run: |
          CONFIG_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$CONFIG_VERSION" != "${TAG#v}" ]; then
            echo "::error::Tag is $TAG but tauri.conf.json says $CONFIG_VERSION. Bump one of them."
            exit 1
          fi

      # tauri-action takes the release body as a string. Handing it a path publishes the
      # path itself, so the file is read into a step output first.
      - name: Read the release notes
        id: notes
        shell: bash
        run: |
          {
            echo "body<<RELEASE_NOTES_EOF"
            cat .github/RELEASE_NOTES.md
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      # Written from a secret rather than committed; notarytool wants a file on disk.
      - name: Write the App Store Connect key
        if: matrix.os == 'macos-15' && env.HAS_APPLE_KEY == 'true'
        env:
          HAS_APPLE_KEY: ${{ secrets.APPLE_API_KEY_BASE64 != '' }}
        run: |
          echo "${{ secrets.APPLE_API_KEY_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing and notarisation. When these secrets are absent — on a fork, or
          # before they are configured — tauri falls back to an ad-hoc signature and the
          # build still succeeds; it just gets the Gatekeeper warning.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          # Signs the updater artifacts. Without these the update check would find a
          # release it refuses to install, which is worse than not publishing one.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: MieSQL ${{ env.TAG }}
          releaseBody: ${{ steps.notes.outputs.body }}
          # Drafted on purpose: three jobs write to one release, so publishing on the first
          # to finish would show a release carrying only macOS files while Linux and
          # Windows are still building. The job below publishes it once they all land.
          releaseDraft: true
          prerelease: false
          # tauri-action writes latest.json from the signed artifacts of every matrix job,
          # which is exactly what the in-app updater reads.
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # Tauri notarises the .app, but the disk image that wraps it is only signed. A
      # downloaded .dmg with no ticket of its own is what Gatekeeper actually assesses when
      # someone double-clicks it, so without this the warning we set out to remove is still
      # there on the path most people take. Verified by downloading the v0.2.1 dmg and
      # watching spctl reject it until it was stapled.
      - name: Notarise and staple the disk image
        if: matrix.os == 'macos-15' && env.HAS_APPLE_KEY == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HAS_APPLE_KEY: ${{ secrets.APPLE_API_KEY_BASE64 != '' }}
        run: |
          set -euo pipefail
          DMG=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          echo "Notarising $DMG"
          xcrun notarytool submit "$DMG" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "${{ secrets.APPLE_API_KEY_ID }}" \
            --issuer "${{ secrets.APPLE_API_ISSUER }}" \
            --wait --timeout 30m
          xcrun stapler staple "$DMG"
          # Fail loudly rather than shipping a disk image that still warns.
          xcrun stapler validate "$DMG"
          spctl -a -vvv -t open --context context:primary-signature "$DMG"
          gh release upload "$TAG" "$DMG" --clobber

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Check every platform produced its artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort | tee assets.txt
          # A release missing a platform is worse than a late one, and latest.json is what
          # the updater reads — without it the in-app check finds nothing.
          missing=0
          for pattern in '[.]dmg$' '[.]app[.]tar[.]gz$' '[.]exe$' '[.]AppImage$' '[.]deb$' '^latest[.]json$'; do
            if ! grep -qE "$pattern" assets.txt; then
              echo "::error::No asset matching $pattern"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Refusing to publish an incomplete release."
            exit 1
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --draft=false --latest
