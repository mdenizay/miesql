name: CI

on:
  push:
    branches: [main, tauri-rewrite]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-22.04, windows-latest]

    steps:
      - uses: actions/checkout@v5

      # Tauri needs the WebKitGTK development headers to compile on Linux. Nothing here is
      # needed at runtime by the packaged app beyond the libraries the .deb depends on.
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            gnome-keyring dbus-x11

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # The SQLite cases run everywhere; the PostgreSQL ones skip themselves unless a
      # server is configured, so the matrix stays fast and self-contained.
      - name: Test
        if: matrix.os != 'ubuntu-22.04'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Linux keeps passwords in the Secret Service, which a headless runner does not have.
      # Starting an unlocked keyring means the credential path is covered here rather than
      # skipped on every run — it is the platform most likely to lack one in the wild.
      - name: Test (with a Secret Service)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          dbus-run-session -- bash -c '
            echo "" | gnome-keyring-daemon --unlock --components=secrets >/dev/null 2>&1
            cargo test --manifest-path src-tauri/Cargo.toml
          '

  frontend:
    name: Frontend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `npm run build` type-checks with tsc before Vite bundles, so a type error fails here.
      - run: npm run build

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: miesql
          POSTGRES_DB: miesql_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev gnome-keyring dbus-x11

      - name: Test against a real server
        env:
          MIESQL_TEST_PG_URL: postgres://postgres:miesql@127.0.0.1:5432/miesql_test?sslmode=disable
          MIESQL_TEST_PG: host=127.0.0.1 port=5432 user=postgres password=miesql dbname=miesql_test
          PGPASSWORD: miesql
        run: |
          psql -h 127.0.0.1 -U postgres -d miesql_test -v ON_ERROR_STOP=1 \
            -f src-tauri/tests/fixtures/pg-probe.sql
          dbus-run-session -- bash -c '
            echo "" | gnome-keyring-daemon --unlock --components=secrets >/dev/null 2>&1
            cargo test --manifest-path src-tauri/Cargo.toml
          '
