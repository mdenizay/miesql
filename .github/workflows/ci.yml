name: CI

on:
  push:
    branches: [main, tauri-rewrite]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-22.04, windows-latest]

    steps:
      - uses: actions/checkout@v5

      # Tauri needs the WebKitGTK development headers to compile on Linux. Nothing here is
      # needed at runtime by the packaged app beyond the libraries the .deb depends on.
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # The SQLite cases run everywhere; the PostgreSQL ones skip themselves unless a
      # server is configured, so the matrix stays fast and self-contained.
      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  frontend:
    name: Frontend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `npm run build` type-checks with tsc before Vite bundles, so a type error fails here.
      - run: npm run build

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: miesql
          POSTGRES_DB: miesql_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Test against a real server
        env:
          MIESQL_TEST_PG_URL: postgres://postgres:miesql@127.0.0.1:5432/miesql_test?sslmode=disable
          MIESQL_TEST_PG: host=127.0.0.1 port=5432 user=postgres password=miesql dbname=miesql_test
        run: |
          # The protocol spike asserts the claim the driver design rests on, so it needs
          # the probe table the tests read from.
          PGPASSWORD=miesql psql -h 127.0.0.1 -U postgres -d miesql_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE types_probe (
            id serial PRIMARY KEY, name text NOT NULL, amount numeric(12,4),
            ratio double precision, when_ts timestamptz, when_d date, flag boolean,
            ident uuid, doc jsonb, tags text[], raw bytea
          );
          INSERT INTO types_probe (name, amount, ratio, when_ts, when_d, flag, ident, doc, tags, raw)
          VALUES ('ada', 1234.5600, 0.5, '2026-01-02 03:04:05+00', '2026-01-02', true,
                  '12345678-9abc-def0-1234-56789abcdef0', '{"k":[1,2]}', ARRAY['a','b'], '\x00ff10');
          INSERT INTO types_probe (name) VALUES ('nulls');
          SQL
          cargo test --manifest-path src-tauri/Cargo.toml
