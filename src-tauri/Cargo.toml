[package]
name = "miesql"
version = "1.0.0"
description = "A fast, native SQL client"
authors = ["mdenizay"]
license = "MIT"
repository = "https://github.com/mdenizay/miesql"
edition = "2021"
rust-version = "1.77"

[lib]
# Tauri builds the app as a library plus a thin binary. Keeping the core in a library is
# what lets the tests exercise it without going through the app.
name = "miesql_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "7"
csv = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "time", "io-util", "net", "process"] }

# Credentials go to the OS store on every platform: Keychain, Credential Manager,
# or the Secret Service.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# TLS is rustls everywhere rather than the system OpenSSL. That is the difference between
# a Linux build that works on any distro and one that needs -dev packages installed.
# Only rustls itself is used directly, and only with ring. The others were pulling their
# default features in, which put aws-lc-rs in the tree next to ring — and rustls panics
# rather than choosing when it finds two providers.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

# PostgreSQL. The simple query protocol returns every value as text and reports the row
# description even when no rows come back, which removes the binary decoding the Swift
# version needed and fixes its "zero rows shows no columns" limitation.
tokio-postgres = { version = "0.7", features = ["runtime"] }
tokio-postgres-rustls = "0.13"

# MySQL and MariaDB, also over the text protocol.
# default-rustls pulls aws-lc-rs, which would put a second crypto provider in the tree
# alongside ring: rustls then cannot pick one and panics at the first TLS handshake. The
# ring variant also keeps cmake and nasm off the Windows build.
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls-ring"] }

# SQLite is compiled in, so there is no system library to find at runtime on any platform.
rusqlite = { version = "0.40", features = ["bundled", "column_decltype"] }

redis = { version = "0.32", features = ["tokio-comp", "tokio-rustls-comp"] }
async-trait = "0.1.92"
tauri-plugin-updater = "2.0.0-rc.4"
tauri-plugin-process = "2.0.0-rc.1"
tauri-plugin-clipboard-manager = "2.1.0-beta.7"

[dev-dependencies]
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[profile.dev]
# Full debug info on a tree this size costs several gigabytes of disk and a noticeable
# part of every link. Line tables keep backtraces and panic locations readable, which is
# what the tests and the doctor actually need.
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
